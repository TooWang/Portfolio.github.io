<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相冊 - 我忘了啦</title>
    <link rel="icon" href="../icon.ico">
    <link rel="stylesheet" href="cover.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="preloader.css">
</head>
<body>
    <!-- Page Transition Overlay -->
    <div id="page-transition-overlay" class="page-transition-overlay"></div>

    <!-- Preloader -->
    <div id="preloader">
        <div class="loader-content">
            <div class="progress-bar-container">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="progress-text">0%</div>
            <div class="progress-label">Loading</div>
        </div>
    </div>

    <section class="gallery-cover">
        <div class="gallery-cover-content">
            <h1 class="gallery-cover-title">相冊</h1>
            <p class="gallery-cover-subtitle">紀錄一些個人的練習與作品的整理。</p>
        </div>
    </section>

    <section class="gallery-section-wrapper">
        <div class="gallery-container">
            <div class="masonry-grid" id="masonryGrid"></div>

            <!-- Lightbox Modal -->
            <div id="lightbox" class="lightbox">
                <span class="lightbox-close">&times;</span>
                <img id="lightbox-img" src="" alt="">
                <div class="lightbox-info">
                    <h2 id="lightbox-title"></h2>
                    <p id="lightbox-subtitle"></p>
                </div>
            </div>
        </div>
    </section>

    <script src="../picture-data.js"></script>
    <script src="preloader.js"></script>
    <script src="cover.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
