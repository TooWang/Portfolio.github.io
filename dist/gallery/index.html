<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相冊 - 我忘了啦</title>
    <link rel="icon" href="../icon.ico">
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <section class="gallery-cover">
        <div class="gallery-cover-content">
            <h1 class="gallery-cover-title">相冊</h1>
            <p class="gallery-cover-subtitle">瀏覽所有作品</p>
        </div>
    </section>

    <section class="gallery-section-wrapper">
        <div class="gallery-container">
            <div class="masonry-grid" id="masonryGrid"></div>

            <!-- Lightbox Modal -->
            <div id="lightbox" class="lightbox">
                <span class="lightbox-close">&times;</span>
                <img id="lightbox-img" src="" alt="">
                <div class="lightbox-info">
                    <h2 id="lightbox-title"></h2>
                    <p id="lightbox-subtitle"></p>
                </div>
            </div>
        </div>
    </section>

    <script src="../picture-data.js"></script>
    <script src="gallery.js"></script>
</body>
</html>
