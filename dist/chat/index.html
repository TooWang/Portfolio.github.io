<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>測試</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">測試</div>
      <button id="newChat" class="btn">＋ 新對話</button>
      <div class="hint">Cloudflare Pages</div>
    </aside>

    <main class="chat">
      <header class="chat-header">測試</header>

      <section id="messages" class="messages"></section>

      <footer class="composer">
        <textarea
          id="input"
          rows="1"
          placeholder="輸入訊息（Enter 送出，Ctrl+Enter 換行）"
        ></textarea>
        <button id="send">送出</button>
      </footer>
    </main>
  </div>

  <!-- Markdown parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
