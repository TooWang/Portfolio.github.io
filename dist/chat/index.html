<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>測試</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">AI 助理</div>
      <button id="newChat" class="btn">＋ 新對話</button>
      <div class="hint">Cloudflare Pages</div>
    </aside>

    <main class="chat">
      <header class="chat-header">網站 AI 客服</header>

      <section id="messages" class="messages"></section>

      <footer class="composer">
        <input type="file" id="fileInput" hidden />
        <div id="filePreview" class="file-preview" hidden></div>
        <button id="attach" class="icon" type="button" title="上傳圖片或檔案">＋</button>
        <textarea
          id="input"
          rows="1"
          placeholder="輸入訊息（Enter 送出，Shift+Enter 換行）"
        ></textarea>
        <button id="send" class="primary" type="button">送出</button>
      </footer>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
